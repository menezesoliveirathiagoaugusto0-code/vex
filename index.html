<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VEX NEXUS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070b13">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{--bg:#070b13;--card:#141c2b;--line:#222d42;--tx:#f4f6fb;--mut:#8b96ab;--ac:#1a8cff;--ok:#2ecc8f;--bar:#0d1422;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef2f8;--card:#fff;--line:#d9e0ec;--tx:#0b1220;--mut:#5b6679;--bar:#fff;color-scheme:light}}*,*::before,*::after{box-sizing:inherit}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh}.mo .app{max-width:480px;margin:0 auto;padding:20px 20px 110px}.mo header{display:flex;justify-content:space-between;align-items:flex-start}.mo .logo{font-weight:900;font-style:italic;font-size:44px;line-height:.9;color:var(--ac);letter-spacing:-2px}.mo .logo small{display:block;font-style:normal;font-weight:700;font-size:15px;letter-spacing:7px;color:var(--tx);margin-top:10px}.mo .tag{font-weight:700;letter-spacing:1px;color:var(--mut);font-size:15px;margin-top:14px}.mo .eyebrow{color:var(--ac);font-weight:700;font-size:15px;margin:36px 0 12px}.mo h1{font-size:36px;line-height:1.2;margin:0 0 16px}.mo h2{font-size:24px;margin:0}.mo .sub{color:var(--mut);margin:0 0 24px}.mo .card{background:var(--card);border-radius:24px;padding:24px;margin-bottom:28px}.mo .card h3{margin:6px 0 10px;font-size:22px}.mo .card p{color:var(--mut);line-height:1.6;margin:0 0 20px}.mo .btn{display:block;width:100%;border:0;border-radius:999px;background:var(--ac);color:#fff;font:600 17px inherit;font-family:inherit;padding:18px;cursor:pointer}.mo .btn.ghost{background:transparent;color:var(--mut);margin-top:6px;padding:12px}.mo .btn:focus-visible,.mo .nav button:focus-visible,.mo .fab:focus-visible,.mo input:focus-visible,.mo select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}.mo .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}.mo .row span{color:var(--mut)}.mo .empty{text-align:center}.mo .empty .ic{font-size:56px;opacity:.7}.mo .empty h3{color:var(--tx)}.mo .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mo .game{background:var(--card);border-radius:20px;overflow:hidden;position:relative}.mo .cover{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#fff}.mo .game .info{padding:12px 14px}.mo .game b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mo .game small{color:var(--mut)}.mo .game .x{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}.mo .status{display:flex;align-items:center;gap:10px;margin-bottom:18px;color:var(--mut)}.mo .dot{width:10px;height:10px;border-radius:50%;background:var(--mut)}.mo .dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(46,204,143,.2)}.mo .nav{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}.mo .nav div{display:flex;width:100%;max-width:480px}.mo .nav button{flex:1;background:none;border:0;color:var(--mut);padding:12px 4px 10px;font:600 12px inherit;font-family:inherit;cursor:pointer}.mo .nav button span{display:block;font-size:22px;margin-bottom:2px}.mo .nav button[aria-current="page"]{color:var(--ac)}.mo .fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));border:0;border-radius:999px;background:var(--ac);color:#fff;font:600 16px inherit;font-family:inherit;padding:15px 22px;cursor:pointer;box-shadow:0 8px 24px rgba(26,140,255,.4)}.mo .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:5}.mo .sheet.open{display:flex}.mo .sheet .in{background:var(--card);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom,0px))}.mo .sheet h3{margin:0 0 6px;font-size:22px}.mo label{display:block;color:var(--mut);font-size:14px;margin:16px 0 6px}.mo input,.mo select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:14px;font:16px inherit;font-family:inherit}.mo .code{font-size:44px;font-weight:800;letter-spacing:10px;text-align:center;margin:20px 0;color:var(--ac)}.mo .item{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line)}.mo .item span{color:var(--mut)}@media (prefers-reduced-motion:no-preference){.mo .sheet.open .in{animation:up .25s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}}
@media (prefers-color-scheme:light){}html.tvm,html.tvm body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}.tvw .tv{display:flex;height:100%;font-size:clamp(14px,1.7vw,26px)}.tvw aside{width:16em;padding:2.2em 1.6em;display:flex;flex-direction:column;gap:.6em;border-right:1px solid var(--line)}.tvw .logo{font-weight:900;font-style:italic;font-size:3.2em;line-height:.9;color:var(--ac);letter-spacing:-2px;margin-bottom:.8em}.tvw .logo small{display:block;font-style:normal;font-size:.36em;letter-spacing:.5em;color:var(--tx);margin-top:.8em}.tvw main{flex:1;padding:2.4em 3em;overflow:hidden}.tvw .f{outline:none;transition:transform .12s,box-shadow .12s}.tvw .f:focus,.tvw .f.on{box-shadow:0 0 0 .18em var(--ac);transform:scale(1.04)}.tvw .nv{padding:.8em 1em;border-radius:.8em;color:var(--mut);font-weight:600;cursor:pointer}.tvw .nv.cur{color:var(--tx);background:var(--card)}.tvw h1{font-size:2.6em;margin:0 0 .2em}.tvw h2{font-size:1.5em;margin:1.4em 0 .6em}.tvw .mut{color:var(--mut)}.tvw .row{display:flex;gap:1.2em;flex-wrap:wrap}.tvw .card{background:var(--card);border-radius:1.2em;padding:1.4em 1.6em}.tvw .btn{display:inline-block;background:var(--ac);color:#fff;font-weight:600;border-radius:999px;padding:.8em 1.8em;cursor:pointer;border:0;font:inherit;font-weight:600}.tvw .btn.alt{background:var(--card);color:var(--tx)}.tvw .game{width:11em;background:var(--card);border-radius:1em;overflow:hidden;cursor:pointer}.tvw .cover{height:8em;display:flex;align-items:center;justify-content:center;font-size:3em;font-weight:900;color:#fff}.tvw .game b{display:block;padding:.6em .8em .1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tvw .game small{display:block;padding:0 .8em .7em;color:var(--mut)}.tvw .code{font-size:3.6em;font-weight:800;letter-spacing:.25em;color:var(--ac);margin:.3em 0}.tvw .dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--mut);margin-right:.6em}.tvw .dot.on{background:var(--ok)}.tvw .hint{position:fixed;bottom:1.2em;right:2em;color:var(--mut);font-size:.8em}.tvw #toast{position:fixed;top:1.4em;right:2em;background:var(--card);border-radius:999px;padding:.6em 1.4em;display:none}
html.tvm #tvw{height:100%}</style>
</head>
<body>
<div class="mo" id="mo">
<div class="app">
  <header>
    <div class="logo">VEX<small>NEXUS</small></div>
    <div class="tag">MOBILE</div>
  </header>
  <main id="view"></main>
</div>

<button class="fab" id="fab">+ Adicionar jogo</button>

<nav class="nav" aria-label="Seções"><div id="nav"></div></nav>

<div class="sheet" id="gameSheet" role="dialog" aria-modal="true" aria-labelledby="gt">
  <div class="in">
    <h3 id="gt">Adicionar jogo</h3>
    <label for="gName">Nome do jogo</label>
    <input id="gName" maxlength="40" placeholder="Ex.: Space Racer">
    <label for="gPlat">Plataforma</label>
    <select id="gPlat"><option>Android</option><option>VEX TV</option><option>Emulador</option></select>
    <button class="btn" id="gSave" style="margin-top:22px">Salvar jogo</button>
    <button class="btn ghost" data-close>Cancelar</button>
  </div>
</div>

<div class="sheet" id="tvSheet" role="dialog" aria-modal="true" aria-labelledby="tt">
  <div class="in">
    <h3 id="tt">Conectar TV</h3>
    <p class="sub" style="margin:0">No navegador da TV, abra este mesmo endereço com #tv no final, entre em VEX Link e digite o código mostrado.</p>
    <label for="tvCode">Código exibido na TV</label><input id="tvCode" inputmode="numeric" maxlength="6" placeholder="000000"><p class="sub" id="tvMsg" style="margin:12px 0 0"></p>
    <button class="btn" id="tvOk">Conectar</button>
    <button class="btn ghost" data-close>Cancelar</button>
  </div>
</div>

</div>
<div class="tvw" id="tvw">
<div class="tv">
  <aside id="tside"></aside>
  <main id="tview"></main>
</div>
<div class="hint">Setas para navegar · OK para escolher · Voltar para o menu</div>
<div id="ttoast" role="status"></div>
</div>
<script>
const TVMODE=location.hash==="#tv";
document.documentElement.classList.toggle("tvm",TVMODE);
document.getElementById(TVMODE?"mo":"tvw").remove();
addEventListener("hashchange",()=>location.reload());
function startMobile(){
const SECTIONS=[["Início","⌂"],["Biblioteca","🎮"],["Loja","🛍"],["Perfil","👤"]];
const COLORS=["#1a8cff","#7a5cff","#e0457b","#f08a24","#1fae8c","#c9a227"];
let state={sec:"Início",games:[],tv:false,code:null};
try{const s=JSON.parse(localStorage.getItem("vexnexus")||"null");if(s)state=Object.assign(state,s,{sec:"Início",tv:false})}catch(e){}
const save=()=>{try{localStorage.setItem("vexnexus",JSON.stringify({games:state.games,code:state.code}))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=t=>t.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function library(){
  if(!state.games.length)return `<div class="card empty"><div class="ic">🎮</div><h3>Sua biblioteca está vazia</h3><p>Adicione seus jogos para começar sua coleção.</p></div>`;
  return `<div class="grid">${state.games.map((g,i)=>`<div class="game"><div class="cover" style="background:${COLORS[i%COLORS.length]}">${esc(g.n[0].toUpperCase())}</div><button class="x" data-del="${i}" aria-label="Remover ${esc(g.n)}">×</button><div class="info"><b>${esc(g.n)}</b><small>${esc(g.p)}</small></div></div>`).join("")}</div>`;
}
function tvCard(){
  return `<div class="card"><div class="eyebrow" style="margin:0 0 10px">VEX LINK</div><h3>${state.tv?"TV conectada":"Conecte sua televisão"}</h3>
  <div class="status"><span class="dot ${state.tv?"on":""}"></span>${state.tv?"VEX TV pareada com este celular":"Prepare a conexão entre seu celular e o VEX TV."}</div>
  <button class="btn" id="tvBtn">${state.tv?"Desconectar TV":"Conectar TV"}</button></div>`;
}
function render(){
  push();
  const s=state.sec,v=$("#view");
  $("#fab").style.display=(s==="Início"||s==="Biblioteca")?"block":"none";
  if(s==="Início")v.innerHTML=`<div class="eyebrow">SEU CENTRO DE JOGOS</div><h1>Bem-vindo ao VEX NEXUS</h1><p class="sub">Seção selecionada: Início</p>${tvCard()}<div class="row"><h2>Minha biblioteca</h2><span>${state.games.length} ${state.games.length===1?"jogo":"jogos"}</span></div>${library()}`;
  else if(s==="Biblioteca")v.innerHTML=`<div class="eyebrow">COLEÇÃO</div><h1>Minha biblioteca</h1><p class="sub">${state.games.length} ${state.games.length===1?"jogo":"jogos"}</p>${library()}`;
  else if(s==="Loja")v.innerHTML=`<div class="eyebrow">LOJA</div><h1>Loja VEX</h1><p class="sub">Em breve você poderá encontrar jogos aqui.</p><div class="card empty"><div class="ic">🛍</div><h3>Nada por aqui ainda</h3><p>Volte em breve para ver os lançamentos.</p></div>`;
  else v.innerHTML=`<div class="eyebrow">CONTA</div><h1>Perfil</h1><p class="sub"> </p><div class="card" style="padding:8px 24px"><div class="item">Jogos na biblioteca<span>${state.games.length}</span></div><div class="item">Status da TV<span>${state.tv?"Conectada":"Desconectada"}</span></div><div class="item" style="border:0">Versão<span>1.0 mobile</span></div></div><button class="btn ghost" id="reset">Apagar todos os dados</button>`;
  $("#nav").innerHTML=SECTIONS.map(([n,i])=>`<button data-sec="${n}" ${n===s?'aria-current="page"':""}><span>${i}</span>${n}</button>`).join("");
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.sec){state.sec=t.dataset.sec;render();scrollTo(0,0)}
  else if(t.id==="fab"){$("#gName").value="";$("#gameSheet").classList.add("open");$("#gName").focus()}
  else if(t.id==="gSave"){const n=$("#gName").value.trim();if(!n){$("#gName").focus();return}state.games.push({n,p:$("#gPlat").value});save();$("#gameSheet").classList.remove("open");render()}
  else if(t.dataset.del){state.games.splice(+t.dataset.del,1);save();render()}
  else if(t.id==="tvBtn"){if(state.tv){state.tv=false;state.code=null;close();save();render()}else{$("#tvMsg").textContent="";$("#tvSheet").classList.add("open");$("#tvCode").focus()}}
  else if(t.id==="tvOk"){const c=$("#tvCode").value.replace(/\D/g,"");if(c.length!==6){$("#tvMsg").textContent="Digite os 6 números mostrados na TV.";return}$("#tvMsg").textContent="Procurando a TV…";connect(c).then(r=>{if(r==="ok"){$("#tvSheet").classList.remove("open")}else{$("#tvMsg").textContent=r==="unavail"?"Conexão indisponível neste aparelho.":"Não encontramos a TV. Confira o código e se a TV está aberta."}})}
  else if(t.id==="reset"){state.games=[];state.tv=false;save();render()}
  else if(t.hasAttribute("data-close"))t.closest(".sheet").classList.remove("open");
});
document.querySelectorAll(".sheet").forEach(s=>s.addEventListener("click",e=>{if(e.target===s)s.classList.remove("open")}));
$("#gName").addEventListener("keydown",e=>{if(e.key==="Enter")$("#gSave").click()});
let es=null,cur=null;
function close(){if(es){es.close();es=null}cur=null}
function send(o){if(cur)fetch("https://ntfy.sh/vexnexus-"+cur,{method:"POST",body:JSON.stringify(Object.assign({from:"phone"},o))}).catch(()=>{})}
function push(){if(state.tv)send({t:"lib",games:state.games})}
function connect(code){
  return new Promise(res=>{
    close();cur=code;let done=false;
    try{es=new EventSource("https://ntfy.sh/vexnexus-"+code+"/sse")}catch(e){res("err");return}
    es.onopen=()=>send({t:"hello"});
    es.onmessage=ev=>{try{const d=JSON.parse(ev.data);if(d.event!=="message")return;const m=JSON.parse(d.message);if(m.from!=="tv")return;
      if(m.t==="ack"&&!done){done=true;state.tv=true;state.code=code;save();render();res("ok")}
      else if(m.t==="hi")push()}catch(e){}};
    setTimeout(()=>{if(!done){res("nf");if(!state.tv)close()}},6000);
  });
}
render();
if(state.code)connect(state.code);
}
function startTV(){
const SECS=["Início","Biblioteca","VEX Link"];
const SAMPLES=[["Space Racer","VEX TV"],["Pixel Quest","VEX TV"],["Neon Drift","Android"],["Block Party","VEX TV"],["Sky Tactics","Android"],["Moto Rush","Emulador"]];
const COLORS=["#1a8cff","#7a5cff","#e0457b","#f08a24","#1fae8c","#c9a227"];
let st={sec:"Início",games:[],tv:false,code:String(Math.floor(100000+Math.random()*900000))};
try{const s=JSON.parse(localStorage.getItem("vextv")||"null");if(s)Object.assign(st,s,{tv:false,sec:"Início"})}catch(e){}
const save=()=>{try{localStorage.setItem("vextv",JSON.stringify({games:st.games,tv:st.tv,code:st.code}))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=t=>t.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const t=$("#ttoast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2200)}

function games(){
  if(!st.games.length)return `<div class="card"><b>Sua biblioteca está vazia</b><p class="mut">Adicione jogos pelo celular ou use um jogo de exemplo.</p><div class="btn f" tabindex="0" data-act="add">Adicionar jogo de exemplo</div></div>`;
  return `<div class="row">${st.games.map((g,i)=>`<div class="game f" tabindex="0" data-act="open" data-i="${i}"><div class="cover" style="background:${COLORS[i%6]}">${esc(g.n[0])}</div><b>${esc(g.n)}</b><small>${esc(g.p)}</small></div>`).join("")}</div>`;
}
function render(){
  $("#tside").innerHTML=`<div class="logo">VEX<small>NEXUS</small></div>`+SECS.map(s=>`<div class="nv f ${s===st.sec?"cur":""}" tabindex="0" data-sec="${s}">${s}</div>`).join("");
  const v=$("#tview");
  if(st.sec==="Início")v.innerHTML=`<div class="mut">SEU CENTRO DE JOGOS</div><h1>Bem-vindo ao VEX NEXUS</h1>
    <div class="card" style="display:inline-block;min-width:22em"><span class="dot ${st.tv?"on":""}"></span>${st.tv?"Celular conectado":"Celular não conectado"}<div style="margin-top:1em"><div class="btn f" tabindex="0" data-sec="VEX Link">${st.tv?"Ver conexão":"Conectar celular"}</div></div></div>
    <h2>Minha biblioteca · ${st.games.length} ${st.games.length===1?"jogo":"jogos"}</h2>${games()}`;
  else if(st.sec==="Biblioteca")v.innerHTML=`<h1>Minha biblioteca</h1><p class="mut">${st.games.length} ${st.games.length===1?"jogo":"jogos"}</p>${games()}${st.games.length?`<div style="margin-top:1.4em" class="btn alt f" tabindex="0" data-act="add">Adicionar jogo de exemplo</div>`:""}`;
  else v.innerHTML=`<h1>VEX Link</h1><p class="mut">No celular, abra o VEX NEXUS, toque em Conectar TV e digite este código.</p><div class="code">${st.code}</div><p class="mut"><span class="dot ${st.tv?"on":""}"></span>${st.tv?"Celular conectado":"Aguardando o celular…"}</p>
    <div class="row"><div class="btn f" tabindex="0" data-act="newcode">Gerar novo código</div></div>`;
  focusFirst();
}
function focusFirst(){const el=$("#tview .f")||$("#tside .f");el&&el.focus()}

function act(el){
  if(el.dataset.sec){st.sec=el.dataset.sec;render();return}
  const a=el.dataset.act;
  if(a==="add"){const s=SAMPLES[st.games.length%SAMPLES.length];st.games.push({n:s[0],p:s[1]});save();render();toast("Jogo adicionado")}
  else if(a==="open")toast("Iniciando "+st.games[+el.dataset.i].n+"…");
  else if(a==="pair"){st.tv=!st.tv;save();render();toast(st.tv?"Celular conectado":"Celular desconectado")}
  else if(a==="newcode"){st.code=String(Math.floor(100000+Math.random()*900000));st.tv=false;save();join();render()}
}
function move(dir){
  const cur=document.activeElement.classList.contains("f")?document.activeElement:null;
  const all=[...document.querySelectorAll(".f")];
  if(!cur){all[0]&&all[0].focus();return}
  const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let best=null,bs=1e9;
  all.forEach(el=>{if(el===cur)return;const q=el.getBoundingClientRect(),x=q.left+q.width/2-cx,y=q.top+q.height/2-cy;
    const ok=dir==="L"?x<-4:dir==="R"?x>4:dir==="U"?y<-4:y>4;if(!ok)return;
    const main=(dir==="L"||dir==="R")?Math.abs(x):Math.abs(y),side=(dir==="L"||dir==="R")?Math.abs(y):Math.abs(x);
    const s=main+side*2.5;if(s<bs){bs=s;best=el}});
  if(best){best.focus();best.scrollIntoView({block:"nearest"})}
}
document.addEventListener("keydown",e=>{
  const k=e.key,m={ArrowLeft:"L",ArrowRight:"R",ArrowUp:"U",ArrowDown:"D"};
  if(m[k]){e.preventDefault();move(m[k])}
  else if(k==="Enter"||k===" "){const el=document.activeElement;if(el&&el.classList.contains("f")){e.preventDefault();act(el)}}
  else if(k==="Escape"||k==="Backspace"||k==="GoBack"){e.preventDefault();const c=$("#tside .cur");c&&c.focus()}
});
document.addEventListener("click",e=>{const el=e.target.closest(".f");if(el)act(el)});
let es=null;
function send(o){fetch("https://ntfy.sh/vexnexus-"+st.code,{method:"POST",body:JSON.stringify(Object.assign({from:"tv"},o))}).catch(()=>{})}
function join(){
  if(es){es.close();es=null}
  try{es=new EventSource("https://ntfy.sh/vexnexus-"+st.code+"/sse")}catch(e){return}
  es.onopen=()=>send({t:"hi"});
  es.onmessage=ev=>{try{const d=JSON.parse(ev.data);if(d.event!=="message")return;const m=JSON.parse(d.message);if(m.from!=="phone")return;
    if(m.t==="hello"){st.tv=true;render();send({t:"ack"})}
    else if(m.t==="lib"&&Array.isArray(m.games)){
      st.games=m.games.slice(0,60).filter(x=>x&&x.n).map(x=>({n:String(x.n).slice(0,40),p:String(x.p||"").slice(0,20)}));st.tv=true;save();render()}}catch(e){}};
}
render();join();
}
